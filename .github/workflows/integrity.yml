name: Workbook integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workbook container and VBA sources (not Excel execution)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $file = 'deliverables/Duplicate_Audit_Studio.xlsx'
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $file))
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            if ($names -contains 'xl/vbaProject.bin') { throw 'XLSX must be macro-free' }
            if ($names -match '^xl/externalLinks/') { throw 'External links found' }
            $formulaCount = 0
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.EndsWith('.xml')) {
                $reader = [IO.StreamReader]::new($entry.Open())
                try { [xml]$xml = $reader.ReadToEnd() } finally { $reader.Dispose() }
                if ($entry.FullName -eq 'xl/workbook.xml') {
                  if ($xml.workbook.sheets.sheet.Count -ne 6) { throw 'Expected six sheets' }
                }
                if ($entry.FullName -match '^xl/worksheets/sheet\d+.xml$') {
                  $formulaCount += @($xml.SelectNodes("//*[local-name()='f']")).Count
                }
              }
            }
            if ($formulaCount -lt 6000) { throw 'Missing audit formulas' }
            Write-Host "Container valid; $formulaCount formulas. Excel calculation and VBA execution NOT tested."
          } finally { $zip.Dispose() }
          foreach ($file in @('vba/DuplicateAudit.bas','vba/AuditTests.bas')) {
            if (!(Test-Path $file)) { throw "Missing $file" }
            if ((Get-Content $file -Raw) -notmatch 'Option Explicit') { throw "Missing Option Explicit: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: duplicate-audit-excel-review
          path: |
            deliverables/*.xlsx
            vba/*.bas
            README.tr.md
            docs/VALIDATION.md
            tests/ACCEPTANCE.md
