name: Çalışma kitabı bütünlüğü
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: windows-latest
    steps:
      - name: Depo dosyalarını al
        uses: actions/checkout@v4
      - name: Çalışma kitabını ve VBA kaynaklarını doğrula (Excel çalıştırılmaz)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $file = 'deliverables/Duplicate_Audit_Studio.xlsx'
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $file))
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            if ($names -contains 'xl/vbaProject.bin') { throw 'XLSX makro içermemeli' }
            if ($names -match '^xl/externalLinks/') { throw 'Dış bağlantı bulundu' }
            $formulaCount = 0
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.EndsWith('.xml')) {
                $reader = [IO.StreamReader]::new($entry.Open())
                try { [xml]$xml = $reader.ReadToEnd() } finally { $reader.Dispose() }
                if ($entry.FullName -eq 'xl/workbook.xml') {
                  if ($xml.workbook.sheets.sheet.Count -ne 6) { throw 'Altı sayfa bekleniyor' }
                }
                if ($entry.FullName -match '^xl/worksheets/sheet\d+.xml$') {
                  $formulaCount += @($xml.SelectNodes("//*[local-name()='f']")).Count
                }
              }
            }
            if ($formulaCount -lt 6000) { throw 'Kontrol formülleri eksik' }
            Write-Host "Dosya yapısı geçerli; $formulaCount formül. Excel hesaplaması ve VBA çalıştırma TEST EDİLMEDİ."
          } finally { $zip.Dispose() }
          foreach ($file in @('vba/DuplicateAudit.bas','vba/AuditTests.bas')) {
            if (!(Test-Path $file)) { throw "Dosya eksik: $file" }
            if ((Get-Content $file -Raw) -notmatch 'Option Explicit') { throw "Option Explicit eksik: $file" }
          }
      - name: Excel inceleme paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: mukerrer-analiz-excel-inceleme
          path: |
            deliverables/*.xlsx
            vba/*.bas
            README.tr.md
            docs/DOGRULAMA.md
            tests/KABUL_KONTROLLERI.md
